<html lang="fr">

<title>Sing for Absolution</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.idle { cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }

  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none; text-align: center;
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #e9edff;
  }

  /* Titre façon générique de film : apparition lente, l'interlettrage s'ouvre, un reflet passe. */
  #title { opacity: 0; }
  #title.play { animation: titleFade 12s ease-in-out forwards; }
  #title h1 {
    margin: 0; font-weight: 200; text-transform: uppercase; font-size: clamp(24px, 4.2vw, 84px);
    letter-spacing: .30em; padding-left: .30em;
    background: linear-gradient(100deg, #aeb9e8 0%, #aeb9e8 40%, #ffffff 50%, #aeb9e8 60%, #aeb9e8 100%);
    background-size: 300% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(120, 145, 255, .45));
  }
  #title.play h1 { animation: titleTrack 12s cubic-bezier(.2, .6, .2, 1) forwards, titleSheen 12s ease-in-out forwards; }
  #title .rule { width: 0; height: 1px; margin: 1.6em auto 1.3em; background: linear-gradient(90deg, transparent, rgba(200, 210, 255, .55), transparent); }
  #title.play .rule { animation: rule 12s ease-out forwards; }
  #title p { margin: 0; font-weight: 400; text-transform: uppercase; font-size: clamp(10px, 1.05vw, 19px); letter-spacing: .8em; padding-left: .8em; color: rgba(215, 222, 255, .62); }
  @keyframes titleFade { 0% { opacity: 0 } 22% { opacity: 1 } 72% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes titleTrack { from { letter-spacing: .30em; padding-left: .30em } to { letter-spacing: .46em; padding-left: .46em } }
  @keyframes titleSheen { 0%, 25% { background-position: 100% 0 } 65%, 100% { background-position: 0% 0 } }
  @keyframes rule { 0%, 15% { width: 0 } 60%, 100% { width: min(38vw, 520px) } }

  #start { transition: opacity .8s ease; }
  #start.off { opacity: 0; }
  #start .big { font-size: 13px; letter-spacing: .55em; text-transform: uppercase; color: rgba(225, 230, 255, .9); margin: 0 0 1.6em; }
  #start .k { margin: .35em 0; font-size: 14px; letter-spacing: .1em; color: rgba(215, 222, 255, .6); }

  #hud {
    position: fixed; left: 16px; bottom: 16px; max-width: calc(100vw - 32px); box-sizing: border-box;
    font: 12px/1.55 ui-monospace, Menlo, monospace; color: rgba(220, 225, 255, .82);
    background: rgba(6, 8, 20, .66); padding: 10px 12px; border-radius: 6px; white-space: pre;
    transition: opacity .4s ease;
  }
  body.idle #hud { opacity: 0; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #ccd; font: 16px sans-serif; padding: 16px; text-align: center; }
</style>
</head>

<script>
/* Lecteur commun, embarqué dans chaque page par synchroniser-lecteur.py. */
function creerLecteurConcert(options) {
  const vitesses = [.25, .5, 1, 2, 4, 8, 16];
  const limite = t => Math.max(0, Math.min(options.duration, Number(t) || 0));
  const format = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  const params = new URLSearchParams(location.search);
  const vitesseDemandee = Number(params.get('vitesse')) || 1;
  let vitesse = vitesses.includes(vitesseDemandee) ? vitesseDemandee : 1;
  let base = 0, origine = performance.now(), lecture = false, commence = false;
  let disponible = options.ready !== false, cinema = !!options.cinema, minuterie;
  let dernierAffichage = '', message = '';
  const style = document.createElement('style');
  style.textContent = `
    #lecteur-concert { position:fixed; z-index:20; left:16px; bottom:16px; max-width:calc(100vw - 32px); max-height:calc(100vh - 32px); overflow:auto; box-sizing:border-box; padding:10px 12px; border:0; border-radius:6px; background:rgba(6,8,20,.66); color:rgba(220,225,255,.82); font:12px/1.55 ui-monospace,Menlo,monospace; white-space:pre-wrap; transition:opacity .4s; }
    body.lecteur-cache { cursor:none; }
    body.lecteur-cache #lecteur-concert, body.lecteur-cache .caption { opacity:0; pointer-events:none; }
    .lc-bande { position:fixed; z-index:10; left:0; right:0; height:max(0px,calc((100vh - 100vw / 2.39) / 2)); background:#000; pointer-events:none; display:none; }
    .lc-bande-haut { top:0; } .lc-bande-bas { bottom:0; }
    body.lecteur-cinema .lc-bande { display:block; }
    @media(max-width:600px) { #lecteur-concert { left:8px; bottom:8px; max-width:calc(100vw - 16px); max-height:calc(100vh - 16px); font-size:11px; } }
  `;
  document.head.append(style);
  const panneau = document.createElement('div');
  panneau.id = 'lecteur-concert';
  panneau.setAttribute('role', 'region');
  panneau.setAttribute('aria-label', 'Informations et raccourcis de lecture');
  document.body.append(panneau);
  for (const cote of ['haut', 'bas']) {
    const bande = document.createElement('div');
    bande.className = `lc-bande lc-bande-${cote}`;
    bande.setAttribute('aria-hidden', 'true');
    document.body.append(bande);
  }
  document.body.classList.toggle('lecteur-cinema', cinema);
  function temps(now = performance.now()) {
    return limite(base + (lecture ? (now - origine) / 1000 * vitesse : 0));
  }
  function partieA(t) {
    let partie = 0;
    options.parts.forEach((p, i) => { if (t >= p.start) partie = i; });
    return partie;
  }
  function etat(now = performance.now()) {
    const time = temps(now);
    if (lecture && time >= options.duration) {
      base = options.duration; lecture = false; afficher();
    }
    return { time, playing:lecture, started:commence, speed:vitesse, cinema };
  }
  function afficher() {
    document.body.classList.remove('lecteur-cache');
    clearTimeout(minuterie);
    if (lecture) minuterie = setTimeout(() => document.body.classList.add('lecteur-cache'), 4000);
  }
  function positionner(t, raison = 'recalage') {
    base = limite(t); origine = performance.now(); commence = true;
    options.onSeek?.(base, raison);
    afficher(); actualiser();
  }
  function jouer(valeur) {
    if (!disponible) return;
    base = temps(); origine = performance.now();
    if (valeur && (!commence || base >= options.duration)) positionner(0, 'debut');
    commence = true; lecture = valeur;
    afficher(); actualiser();
  }
  function debut() {
    if (!disponible) return;
    positionner(0, 'debut'); jouer(true);
  }
  function changerVitesse(valeur) {
    base = temps(); origine = performance.now(); vitesse = valeur;
    afficher(); actualiser();
  }
  function ajusterVitesse(sens) {
    changerVitesse(vitesses[Math.max(0, Math.min(vitesses.length - 1, vitesses.indexOf(vitesse) + sens))]);
  }
  async function pleinEcran() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { message = 'Plein écran indisponible dans cet aperçu.'; }
    afficher(); actualiser();
  }
  function changerCinema() {
    cinema = !cinema;
    document.body.classList.toggle('lecteur-cinema', cinema);
    afficher();
  }
  function actualiser() {
    const courant = etat(), partie = partieA(courant.time);
    const statut = !disponible ? 'Chargement' : !commence ? 'Prêt' : courant.time >= options.duration ? 'Fin' : lecture ? 'Lecture' : 'Pause';
    const touches = options.parts.slice(0, 9).map((p, i) => `  ${i + 1} ${p.name}`).join('\n');
    const texte = `${options.name}\n${statut} · ${format(courant.time)} / ${format(options.duration)} · ×${String(vitesse).replace('.', ',')} · ${options.parts[partie].name}`
      + (options.details ? '\n' + options.details() : '')
      + '\n\nEspace / Entrée lecture / pause   R début\n← → ~10 s   + - vitesse   F plein écran   L cinéma   H commandes\nPage ↑ / ↓ partie précédente / suivante'
      + (options.help ? '\n' + options.help : '')
      + '\n' + touches + (message ? '\n' + message : '');
    if (texte !== dernierAffichage) { panneau.textContent = texte; dernierAffichage = texte; }
  }
  addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest('button,input,select,textarea,[contenteditable="true"]')) return;
    const touche = e.key.toLowerCase();
    if (touche === ' ' || touche === 'enter') { e.preventDefault(); jouer(!lecture); }
    else if (touche === 'r') debut();
    else if (touche === 'arrowleft' || touche === 'arrowright') { e.preventDefault(); positionner(temps() + (touche === 'arrowright' ? 10 : -10)); }
    else if (touche === '+' || touche === '=') ajusterVitesse(1);
    else if (touche === '-') ajusterVitesse(-1);
    else if (/^[1-9]$/.test(touche) && options.parts[Number(touche) - 1]) positionner(options.parts[Number(touche) - 1].start);
    else if (touche === 'pageup' || touche === 'pagedown') {
      e.preventDefault();
      const index = Math.max(0, Math.min(options.parts.length - 1, partieA(temps()) + (touche === 'pagedown' ? 1 : -1)));
      positionner(options.parts[index].start);
    }
    else if (touche === 'f') pleinEcran();
    else if (touche === 'l') changerCinema();
    else if (touche === 'h') { clearTimeout(minuterie); document.body.classList.toggle('lecteur-cache'); }
    else if (options.onKey?.(touche)) { afficher(); actualiser(); }
  });
  addEventListener('pointermove', afficher);
  addEventListener('pointerdown', afficher);
  function miseAJour() { actualiser(); requestAnimationFrame(miseAJour); }
  const api = {
    read:etat, seek:positionner, restart:debut, setPlaying:jouer, setSpeed:changerVitesse, wake:afficher,
    setReady(valeur) { disponible = valeur; if (!valeur) { base = temps(); lecture = false; } actualiser(); },
  };
  // ?t=... reste un aperçu en pause, avec les mêmes commandes que la lecture normale.
  if (params.has('t')) positionner(Number(params.get('t')), 'apercu');
  actualiser(); requestAnimationFrame(miseAJour);
  return api;
}
</script>
<!-- lecteur-concert:fin -->
<script>
"use strict";

/* ===================================================================================
   Partition calée sur la version album (Absolution, 2003, 4:55), d'après les horodatages
   des paroles synchronisées. On lance au premier son de la chanson, tout suit seul.
   Chaque partie définit un état visé ; on y glisse en douceur (tau = temps de transition).
   lightY : hauteur de la source (1 = haut de l'écran, au-dessus = cachée).
   clouds : couverture nuageuse. focus : distance de mise au point. aperture : flou.
   =================================================================================== */
const PARTS = [
  { name: "Intro : piano", start: 0, tau: 3.5, p: {
      density: .16, speed: .30, rays: .45, lightY: 1.34, lightPow: .55, clouds: .78, fog: .55,
      focus: 2.4, aperture: 1.0, stretch: 0, exposure: 1.0, flare: .25, white: 0, cam: .05 } },
  { name: "Couplet 1", start: 28.4, tau: 5.0, p: {
      density: .28, speed: .42, rays: .60, lightY: 1.27, lightPow: .80, clouds: .66, fog: .68,
      focus: 6.0, aperture: .80, stretch: 0, exposure: 1.0, flare: .40, white: .08, cam: .07 } },
  { name: "Refrain 1", start: 76.5, tau: 2.2, p: {
      density: .40, speed: .70, rays: .85, lightY: 1.18, lightPow: 1.10, clouds: .58, fog: .80,
      focus: 9.0, aperture: .70, stretch: .04, exposure: 1.02, flare: .60, white: .20, cam: .12 } },
  { name: "Respiration", start: 103.1, tau: 4.0, p: {
      density: .26, speed: .45, rays: .60, lightY: 1.24, lightPow: .80, clouds: .66, fog: .70,
      focus: 3.5, aperture: .95, stretch: 0, exposure: 1.0, flare: .40, white: .10, cam: .07 } },
  { name: "Couplet 2", start: 118.1, tau: 4.0, p: {
      density: .36, speed: .60, rays: .75, lightY: 1.20, lightPow: 1.00, clouds: .60, fog: .80,
      focus: 7.5, aperture: .75, stretch: 0, exposure: 1.0, flare: .50, white: .15, cam: .10 } },
  { name: "Refrain 2", start: 166.8, tau: 1.8, p: {
      density: .48, speed: .95, rays: 1.0, lightY: 1.13, lightPow: 1.35, clouds: .52, fog: .90,
      focus: 10.0, aperture: .65, stretch: .10, exposure: 1.05, flare: .80, white: .30, cam: .16 } },
  { name: "Pont : la montée", start: 194.3, tau: 6.0, p: {
      density: .55, speed: 1.20, rays: 1.10, lightY: 1.06, lightPow: 1.70, clouds: .48, fog: .95,
      focus: 6.0, aperture: .80, stretch: .30, exposure: 1.06, flare: 1.0, white: .50, cam: .24 } },
  { name: "Refrain final", start: 211.9, tau: 2.0, p: {
      density: .62, speed: 1.65, rays: 1.25, lightY: .97, lightPow: 2.2, clouds: .46, fog: 1.0,
      focus: 5.0, aperture: .85, stretch: .55, exposure: 1.08, flare: 1.25, white: .70, cam: .32 } },
  { name: "Fin", start: 253.7, tau: 10.0, p: {
      density: .14, speed: .28, rays: .40, lightY: 1.32, lightPow: .50, clouds: .80, fog: .50,
      focus: 2.6, aperture: 1.0, stretch: 0, exposure: .95, flare: .25, white: .10, cam: .04 } },
];
const LEAD = 1.0;           // les transitions démarrent 1 s avant la voix
const END = 287;            // début du fondu au noir final (la chanson dure 4:55)
const N_DUST = 36000;       // poussières lumineuses (volume 3D)
const N_HERO = 90;          // gros bokehs au premier plan
const NEAR = 1.0, FAR = 42.0, FOCAL = 1.7;

/* ---------- WebGL ---------- */
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: "high-performance" });
if (!gl) { document.getElementById("err").style.display = "flex"; throw new Error("WebGL2 indisponible"); }
const HDR = !!gl.getExtension("EXT_color_buffer_float") || !!gl.getExtension("EXT_color_buffer_half_float");

const FS_VS = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const COMMON = `
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 6; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
  return v;
}`;

/* 1. Nuages (texture étendue au-delà de l'écran, pour que la source cachée en haut éclaire quand même).
      r = densité, g = liseré lumineux, b = lumière émise après traversée des nuages, a = transmission. */
const CLOUD_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform vec2 uExtMin, uExtSize, uLight;
uniform float uAsp, uTime, uLightPow, uClouds;
${COMMON}
float dens(vec2 p, vec2 L) {
  vec2 q = p * vec2(1.25, 2.3) + vec2(uTime * 0.011, -uTime * 0.004);
  vec2 w = vec2(fbm(q * 0.8 + vec2(0.0, uTime * 0.007)), fbm(q * 0.8 + vec2(5.2, 1.3) - uTime * 0.006));
  float f = fbm(q + w * 1.8);
  // Autour de la source, la couche reste trouée (~50 %) : c'est elle qui découpe la lumière en faisceaux.
  float cov = mix(uClouds, 0.56, exp(-length(p - L) * 1.6));
  float c = 1.0 - cov;
  float d = smoothstep(c - 0.14, c + 0.22, f);
  // Voile déchiqueté juste devant la source : il découpe la lumière en faisceaux.
  vec2 r = p - L;
  float lace = fbm(r * vec2(5.0, 7.0) + w * 2.2 + vec2(uTime * 0.018, -uTime * 0.012));
  float veil = smoothstep(0.40, 0.55, lace) * exp(-dot(r, r) * 4.0);
  d = max(d, veil * 0.92);
  return d * smoothstep(0.30, 0.85, p.y);
}
void main() {
  vec2 s = uExtMin + vUv * uExtSize;
  vec2 p = vec2((s.x - 0.5) * uAsp, s.y);
  vec2 L = vec2((uLight.x - 0.5) * uAsp, uLight.y);
  float dl = length(p - L);
  // Émission « plate » autour de la source : seuls les trous du voile comptent, d'où des faisceaux contrastés.
  float ang = atan(p.x - L.x, L.y - p.y);
  float gaps = noise(vec2(ang * 7.0, uTime * 0.035)) * 0.62 + noise(vec2(ang * 19.0 + 3.0, -uTime * 0.055)) * 0.38;
  gaps = mix(1.0, smoothstep(0.42, 0.72, gaps), smoothstep(0.03, 0.10, dl));
  float E = uLightPow * smoothstep(0.50, 0.03, dl) * 1.8 * gaps;
  float d = dens(p, L);
  float T = exp(-d * 5.5);
  float d2 = dens(p + normalize(L - p) * 0.03, L);
  float silver = clamp((d - d2) * 2.5, 0.0, 1.0) * exp(-dl * 2.0) * uLightPow;
  float scatter = d * (1.0 - d) * 4.0 * exp(-dl * 2.0) * uLightPow;
  o = vec4(d, silver + scatter * 0.55, E * T, T);
}`;

/* 2. Rayons volumétriques : diffusion radiale de la lumière qui passe entre les nuages. */
const RAYS_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uOcc;
uniform vec2 uExtMin, uExtSize, uLight, uRes;
uniform float uFrame;
${COMMON}
void main() {
  const int S = 72;
  vec2 stepv = (uLight - vUv) / float(S);
  vec2 c = vUv + stepv * hash(vUv * uRes + fract(uFrame * 0.618) * 17.0);
  float illum = 1.0, sum = 0.0;
  for (int i = 0; i < S; i++) {
    sum += texture(uOcc, (c - uExtMin) / uExtSize).b * illum;
    illum *= 0.972;
    c += stepv;
  }
  o = vec4(sum / float(S), 0.0, 0.0, 1.0);
}`;

/* 3. Ciel, source, nuages, brume éclairée par les rayons. */
const SCENE_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uCloud, uRays;
uniform vec2 uExtMin, uExtSize, uLight;
uniform float uAsp, uTime, uLightPow, uFog, uRaysAmt, uPulse;
${COMMON}
void main() {
  vec2 s = vUv;
  vec2 p = vec2((s.x - 0.5) * uAsp, s.y);
  vec2 L = vec2((uLight.x - 0.5) * uAsp, uLight.y);
  vec4 cl = texture(uCloud, (s - uExtMin) / uExtSize);
  float d = cl.r, T = cl.a;

  vec3 core = vec3(1.0, 0.95, 0.86);       // coeur légèrement chaud
  vec3 glow = vec3(0.42, 0.56, 1.0);       // halo froid
  vec3 col = mix(vec3(0.0008, 0.0010, 0.0032), vec3(0.0050, 0.0066, 0.020), smoothstep(0.0, 1.0, s.y));

  float dl = length(p - L);
  float lp = uLightPow * (1.0 + 0.12 * uPulse);
  col += (core * exp(-dl * dl / 0.0030) * 9.0 + glow * (exp(-dl * 3.2) * 0.45 + exp(-dl * 1.1) * 0.025)) * lp * T;

  vec3 cloudBody = vec3(0.004, 0.005, 0.013) * (1.0 + lp * 0.35);
  col = mix(col, cloudBody + col * 0.12, d * 0.88);
  col += cl.g * mix(glow, core, 0.55) * 0.5 / (0.6 + lp);

  float t = uTime;
  vec2 fq = vec2(p.x * 1.3 + t * 0.008, p.y * 2.1 - t * 0.026);
  float fn = fbm(fq + vec2(fbm(fq * 0.7 + t * 0.01), fbm(fq * 0.7 - 2.7)) * 1.4);
  float fogD = uFog * smoothstep(0.30, 0.85, fn) * (1.0 - 0.45 * smoothstep(0.15, 1.0, s.y));
  float rl = texture(uRays, s).r;
  rl = rl * rl / (rl + 0.15);   // contraste : creuse les zones entre les faisceaux
  col += glow * rl * uRaysAmt * (0.15 + 1.8 * fogD) * 2.6;
  col += vec3(0.006, 0.008, 0.020) * fogD;

  o = vec4(col, 1.0);
}`;

/* 4. Particules en 3D : perspective, profondeur de champ (bokeh hexagonal), éclairage par les rayons,
      reflets de paillettes, filé de mouvement. Énergie conservée : plus c'est flou, plus c'est diffus. */
const PART_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec4 aA;   // x, y, z, rang
layout(location = 1) in vec4 aB;   // vitesse, phase, taille, paillette
uniform sampler2D uRays;
uniform vec2 uRes, uLight;
uniform float uAsp, uF, uNear, uFar, uTravel, uCamZ, uTime, uDensity, uStretch, uBright, uPulse,
              uWhite, uFocus, uAperture, uRaysAmt, uLightPow, uVel, uHero;
out vec2 vLocal; out float vR, vL, vBokeh; out vec3 vCol; out float vRot;
void main() {
  float hero = uHero;
  float range = uFar - uNear;
  float z = hero > 0.5 ? mix(0.75, 2.8, aA.z) : uNear + fract(aA.z - uCamZ / range) * range;
  float halfH = z / uF;
  float spd = (0.6 + 0.8 * aB.x) * (hero > 0.5 ? 0.22 : 1.0);

  float y, x;
  if (hero > 0.5) {
    y = (fract(aA.y + uTravel * spd / (2.8 * halfH)) * 2.8 - 1.4) * halfH;
    x = (aA.x * 2.0 - 1.0) * 1.3 * halfH * uAsp;
  } else {
    float band = 2.6 * uFar / uF;
    y = (fract(aA.y + uTravel * spd / band) - 0.5) * band;
    x = (aA.x * 2.0 - 1.0) * 1.35 * uFar / uF * uAsp;
  }
  float ph = aB.y * 6.2831853;
  x += sin(uTime * (0.17 + 0.25 * aB.y) + ph) * 0.05 * (0.4 + aB.y) + sin(uTime * 0.06 + aA.x * 31.0) * 0.07;
  y += sin(uTime * (0.21 + 0.2 * aB.x) + ph * 1.7) * 0.03;

  vec2 ndc = vec2(x * uF / (z * uAsp), y * uF / z);
  vec2 suv = ndc * 0.5 + 0.5;

  float pxw = uF / z * uRes.y * 0.5;                       // pixels par unité de monde
  float r = max(mix(0.005, 0.014, aB.z * aB.z) * pxw, 0.65);
  float coc = uAperture * abs(1.0 / z - 1.0 / uFocus) * uRes.y * 0.042;
  float R = sqrt(r * r + coc * coc) + 0.45;
  float energy = r * r / (R * R);
  energy = mix(energy, sqrt(energy), 0.45);

  float velPx = uVel * spd * pxw;
  float Lpx = min(uStretch * velPx * 0.11, uRes.y * 0.09) * (1.0 - smoothstep(0.25, 0.6, coc / R));

  float ext = R * 1.6 + 1.5;
  vec2 c = vec2(float(gl_VertexID & 1), float(gl_VertexID >> 1)) * 2.0 - 1.0;
  vLocal = c * vec2(ext, ext + Lpx);
  vec2 offPx = vLocal - vec2(0.0, Lpx);                     // la tête reste en haut, la traînée descend
  gl_Position = vec4(ndc + offPx / (uRes * 0.5), 0.0, 1.0);

  vR = R; vL = Lpx; vBokeh = clamp(coc / R, 0.0, 1.0); vRot = aB.w * 1.047;

  float vis = 1.0 - smoothstep(uDensity - 0.05, uDensity, aA.w);
  if (hero < 0.5) vis *= smoothstep(uNear, uNear + 1.6, z) * (1.0 - smoothstep(uFar - 7.0, uFar, z));
  vis *= 1.0 - smoothstep(1.0, 1.2, abs(ndc.y));
  float lit = textureLod(uRays, clamp(suv, 0.0, 1.0), 0.0).r;
  float nearL = exp(-length((suv - uLight) * vec2(uAsp, 1.0)) * 2.2) * uLightPow;
  float tw = 0.7 + 0.3 * sin(uTime * (0.7 + aB.y * 2.3) + aB.y * 50.0);
  float glint = aB.w > 0.72 ? pow(max(0.0, sin(uTime * (1.2 + aB.w * 2.5) + aB.x * 97.0)), 18.0) * 3.5 : 0.0;
  float atm = mix(0.25, 1.0, exp(-z * 0.06));
  float b = (0.30 + lit * uRaysAmt * 3.0 + nearL * 0.5) * atm * (tw + glint) * (1.0 + uPulse * 0.5);
  b *= hero > 0.5 ? 1.7 : 1.0;

  vec3 ice = vec3(0.52, 0.70, 1.0), vio = vec3(0.66, 0.50, 1.0), wht = vec3(1.0, 0.97, 0.92);
  vec3 col = mix(ice, vio, smoothstep(0.4, 1.0, aA.y));
  col = mix(col, wht, clamp(0.15 + 0.55 * uWhite * (1.0 - z / uFar) + nearL * 0.4, 0.0, 1.0));
  vCol = col * b * energy * vis * uBright * 3.2 * (1.0 / (1.0 + Lpx / (R * 2.5)));
}`;

const PART_FS = `#version 300 es
precision highp float;
in vec2 vLocal; in float vR, vL, vBokeh; in vec3 vCol; in float vRot;
out vec4 o;
void main() {
  float yy = vLocal.y;
  vec2 d = vec2(vLocal.x, yy - clamp(yy, -vL, vL));
  float dist = length(d);
  float g = exp(-dist * dist / (vR * vR) * 2.2) + exp(-dist / vR * 1.3) * 0.035;

  vec2 h = d / vR;
  float cr = cos(vRot), sr = sin(vRot);
  h = mat2(cr, -sr, sr, cr) * h;
  vec2 a = abs(h);
  float hex = max(a.x * 0.8660254 + a.y * 0.5, a.y);
  float sh = mix(length(h), hex, 0.42);
  float aa = 1.3 / vR;
  float disk = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, sh);
  float rim = smoothstep(0.5, 1.0, sh);
  float bok = disk * (0.72 + 0.5 * rim) * 0.5;

  float shape = mix(g, bok, smoothstep(0.15, 0.6, vBokeh));
  if (vL > 0.0) shape *= mix(0.18, 1.0, smoothstep(-vL - vR, vL, yy));
  vec3 col = vCol * shape;
  col *= 1.0 + vBokeh * rim * disk * vec3(-0.18, 0.0, 0.28);   // légère frange chromatique sur les bords du bokeh
  o = vec4(max(col, 0.0), 1.0);
}`;

/* 5. Bloom par chaîne de mips (dual filter). */
const DOWN_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uHp; uniform float uFirst;
vec3 s(vec2 uv) { vec3 c = texture(uTex, uv).rgb; return uFirst > 0.5 ? min(c, vec3(40.0)) : c; }
void main() {
  vec3 c = s(vUv) * 4.0 + s(vUv - uHp) + s(vUv + uHp) + s(vUv + vec2(uHp.x, -uHp.y)) + s(vUv - vec2(uHp.x, -uHp.y));
  o = vec4(c / 8.0, 1.0);
}`;
const UP_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uHp;
void main() {
  vec3 c = texture(uTex, vUv + vec2(-uHp.x * 2.0, 0.0)).rgb + texture(uTex, vUv + vec2(-uHp.x, uHp.y)).rgb * 2.0
         + texture(uTex, vUv + vec2(0.0, uHp.y * 2.0)).rgb + texture(uTex, vUv + vec2(uHp.x, uHp.y)).rgb * 2.0
         + texture(uTex, vUv + vec2(uHp.x * 2.0, 0.0)).rgb + texture(uTex, vUv + vec2(uHp.x, -uHp.y)).rgb * 2.0
         + texture(uTex, vUv + vec2(0.0, -uHp.y * 2.0)).rgb + texture(uTex, vUv + vec2(-uHp.x, -uHp.y)).rgb * 2.0;
  o = vec4(c / 12.0, 1.0);
}`;

/* 6. Flare anamorphique : les hautes lumières s'étirent à l'horizontale, comme avec un objectif de cinéma. */
const FLARE_EXTRACT_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform float uThresh;
void main() {
  vec3 c = texture(uTex, vUv).rgb;
  float l = max(c.r, max(c.g, c.b));
  o = vec4(c * max(l - uThresh, 0.0) / max(l, 1e-4), 1.0);
}`;
const FLARE_BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform float uStep;
void main() {
  vec3 c = vec3(0.0); float wsum = 0.0;
  for (int i = -3; i <= 3; i++) {
    float w = exp(-abs(float(i)) * 0.55);
    c += texture(uTex, vUv + vec2(float(i) * uStep, 0.0)).rgb * w; wsum += w;
  }
  o = vec4(c / wsum, 1.0);
}`;

/* 7. Image finale : aberration chromatique, bloom, flare, étalonnage, tone mapping, vignettage,
      grain argentique, format cinémascope. */
const COMP_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uBloom, uFlare;
uniform vec2 uRes;
uniform float uAsp, uExposure, uBloomAmt, uFlareAmt, uFade, uTime, uBars;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
void main() {
  vec2 uv = vUv, cc = uv - 0.5;
  vec2 ca = cc * vec2(uAsp, 1.0);
  float r2 = dot(ca, ca);
  vec2 off = cc * r2 * 0.0065;
  vec3 col = vec3(texture(uScene, uv - off).r, texture(uScene, uv).g, texture(uScene, uv + off).b);
  col += texture(uBloom, uv).rgb * uBloomAmt;
  col += texture(uFlare, uv).rgb * vec3(0.30, 0.52, 1.0) * uFlareAmt;
  col *= uExposure;

  float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(col * vec3(0.90, 0.97, 1.14), col * vec3(1.04, 1.0, 0.96), smoothstep(0.05, 0.9, l));
  col = aces(col);
  col *= mix(1.0, smoothstep(1.3, 0.2, length(cc * vec2(uAsp * 0.78, 1.0))), 0.62);
  col *= uFade;
  col = pow(col, vec3(1.0 / 2.2));

  vec2 gp = uv * uRes;
  float n = hash(gp + fract(uTime * 24.0) * vec2(91.7, 37.3)) + hash(gp * 1.37 + fract(uTime * 24.0 + 0.5) * vec2(17.1, 63.9)) - 1.0;
  float lum = dot(col, vec3(0.333));
  col += n * mix(0.020, 0.008, lum);

  float edge = 1.0 / uRes.y;
  float bars = smoothstep(uBars - edge, uBars + edge, uv.y) * smoothstep(uBars - edge, uBars + edge, 1.0 - uv.y);
  o = vec4(col * bars, 1.0);
}`;

/* ---------- Plomberie ---------- */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + "\n" + src);
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const loc = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const u = gl.getActiveUniform(p, i); loc[u.name] = gl.getUniformLocation(p, u.name); }
  return { p, loc };
}
const P = {
  cloud: program(FS_VS, CLOUD_FS), rays: program(FS_VS, RAYS_FS), scene: program(FS_VS, SCENE_FS),
  part: program(PART_VS, PART_FS), down: program(FS_VS, DOWN_FS), up: program(FS_VS, UP_FS),
  fx: program(FS_VS, FLARE_EXTRACT_FS), fb: program(FS_VS, FLARE_BLUR_FS), comp: program(FS_VS, COMP_FS),
};
const emptyVao = gl.createVertexArray();

function use(prog, uniforms, textures) {
  gl.useProgram(prog.p);
  let unit = 0;
  for (const [name, tex] of Object.entries(textures || {})) {
    gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(prog.loc[name], unit++);
  }
  for (const [name, v] of Object.entries(uniforms)) {
    const l = prog.loc[name]; if (!l) continue;
    if (typeof v === "number") gl.uniform1f(l, v); else if (v.length === 2) gl.uniform2f(l, v[0], v[1]); else gl.uniform3f(l, v[0], v[1], v[2]);
  }
}
function bindTarget(t) { gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fb : null); gl.viewport(0, 0, t ? t.w : W, t ? t.h : H); }
function pass(prog, dst, uniforms, textures) {
  use(prog, uniforms, textures); bindTarget(dst);
  gl.bindVertexArray(emptyVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Particules : tirage fixe, même rendu à chaque lancement.
let seed = 20261010;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
function makeParticles(n) {
  const data = new Float32Array(n * 8);
  for (let i = 0; i < n * 8; i++) data[i] = rnd();
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 32, 0);  gl.vertexAttribDivisor(0, 1);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(1, 1);
  gl.bindVertexArray(null);
  return { vao, n };
}
const dust = makeParticles(N_DUST);
const heroes = makeParticles(N_HERO);

function target(w, h) {
  w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (HDR) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb, w, h };
}
function free(t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }

const EXT_MIN = [-0.3, -0.05], EXT_SIZE = [1.6, 1.7];
let W = 0, H = 0, quality = 1, T = null;
function resize() {
  // Résolution native de l'écran (vidéoprojecteur), plafonnée à la 4K, ajustée si la machine peine.
  const dpr = window.devicePixelRatio || 1;
  let w = innerWidth * dpr, h = innerHeight * dpr;
  const cap = Math.min(1, Math.sqrt((3840 * 2160) / (w * h)));
  w = Math.max(2, Math.round(w * cap * quality)); h = Math.max(2, Math.round(h * cap * quality));
  if (w === W && h === H) return;
  W = w; H = h; canvas.width = w; canvas.height = h;
  if (T) { [T.cloud, T.rays, T.scene, T.fa, T.fb, ...T.mips].forEach(free); }
  const mips = [];
  for (let i = 1; i <= 7; i++) mips.push(target(w / 2 ** i, h / 2 ** i));
  T = {
    cloud: target(w * 0.55, h * 0.62), rays: target(w / 2, h / 2), scene: target(w, h),
    fa: target(w / 4, h / 10), fb: target(w / 4, h / 10), mips,
  };
}
addEventListener("resize", resize);
resize();

/* ---------- Temps, partition, contrôles ---------- */
const cur = { ...PARTS[0].p };
let last = performance.now(), time = 0, elapsed = 0, travel = 0, camZ = 0, fade = 0, frameNo = 0;
let taps = [], bpm = 0, beatOrigin = 0;
let fpsAvg = 60, slowFor = 0, fastFor = 0;
const titleEl = document.getElementById("title");
const startEl = document.getElementById("start");
titleEl.classList.add("play");
const titleAnimations = titleEl.getAnimations({ subtree:true });
titleAnimations.forEach(animation => { animation.pause(); animation.currentTime = 0; });
function partAt(t) { let p = PARTS[0]; for (const x of PARTS) if (t >= x.start) p = x; return p; }
function tapTempo() {
  const now = performance.now();
  taps = taps.filter(x => now - x < 3000); taps.push(now);
  if (taps.length >= 3) bpm = 60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1));
  beatOrigin = now;
}
function annulerTempo() { bpm = 0; taps = []; }
const lecteur = creerLecteurConcert({
  name: "Sing for Absolution", duration: 295, parts: PARTS, cinema:true,
  help:"T tempo manuel   0 annuler le tempo",
  details:() => (bpm ? Math.round(bpm) + " bpm (tap)" : "Respiration lente") + ` · ${W}×${H}, ${Math.round(fpsAvg)} i/s`,
  onSeek(t) {
    Object.assign(cur, partAt(t + LEAD).p);
    time = t; travel = t * cur.speed * .55; camZ = t * cur.cam;
    fade = Math.min(1, t / 4) * Math.max(0, Math.min(1, 1 - (t - END) / 7));
    if (t === 0) annulerTempo();
  },
  onKey(key) { if (key === 't') { tapTempo(); return true; } if (key === '0') { annulerTempo(); return true; } }
});
/* ---------- Rendu ---------- */
function frame(now) {
  const rawDt = (now - last) / 1000; last = now;
  const lecture = lecteur.read(now);
  const dt = lecture.playing ? Math.min(0.05, rawDt) * lecture.speed : 0;
  time += dt; if (lecture.playing) frameNo++;
  elapsed = lecture.time;
  startEl.classList.toggle('off', lecture.started);
  titleAnimations.forEach(animation => { animation.currentTime = elapsed * 1000; });

  // Qualité adaptative : on baisse la résolution si la machine n'arrive pas à suivre.
  if (rawDt < 0.25 && document.visibilityState === "visible") fpsAvg += (1 / Math.max(rawDt, 1e-3) - fpsAvg) * 0.05;
  if (fpsAvg < 48) { slowFor += rawDt; fastFor = 0; } else if (fpsAvg > 58) { fastFor += rawDt; slowFor = 0; }
  if (slowFor > 2 && quality > 0.55) { quality = Math.max(0.55, quality - 0.1); slowFor = 0; resize(); }
  if (fastFor > 8 && quality < 1) { quality = Math.min(1, quality + 0.1); fastFor = 0; resize(); }

  const part = partAt(elapsed + LEAD);
  const a = 1 - Math.exp(-dt / part.tau);
  for (const key in cur) cur[key] += (part.p[key] - cur[key]) * a;
  travel += dt * cur.speed * 0.55;
  camZ += dt * cur.cam;

  let fadeTarget = lecture.started ? 1 : 0;
  if (elapsed > END) fadeTarget = Math.max(0, 1 - (elapsed - END) / 7);
  fade += (fadeTarget - fade) * (1 - Math.exp(-dt / (elapsed < 8 ? 2.2 : 0.6)));
  if (elapsed >= 294) fade = 0;
  const asp = W / H;

  let env;
  if (bpm > 0) { const ph = ((now - beatOrigin) / 1000) * bpm / 60; env = Math.exp(-(ph - Math.floor(ph)) * 5); }
  else env = 0.5 + 0.5 * Math.sin(time * Math.PI * 2 / 4.6);
  const pulse = env * Math.min(1, cur.speed);

  const light = [0.5 + Math.sin(time * 0.031) * 0.025, cur.lightY + Math.sin(time * 0.047) * 0.008];
  const ext = { uExtMin: EXT_MIN, uExtSize: EXT_SIZE };

  gl.disable(gl.BLEND);
  pass(P.cloud, T.cloud, { ...ext, uLight: light, uAsp: asp, uTime: time, uLightPow: cur.lightPow, uClouds: cur.clouds });
  pass(P.rays, T.rays, { ...ext, uLight: light, uRes: [T.rays.w, T.rays.h], uFrame: frameNo }, { uOcc: T.cloud.tex });
  pass(P.scene, T.scene, { ...ext, uLight: light, uAsp: asp, uTime: time, uLightPow: cur.lightPow, uFog: cur.fog, uRaysAmt: cur.rays, uPulse: pulse },
       { uCloud: T.cloud.tex, uRays: T.rays.tex });

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  const pu = {
    uRes: [W, H], uLight: light, uAsp: asp, uF: FOCAL, uNear: NEAR, uFar: FAR, uTravel: travel, uCamZ: camZ, uTime: time,
    uDensity: cur.density, uStretch: cur.stretch, uBright: 1.0, uPulse: pulse, uWhite: cur.white,
    uFocus: cur.focus, uAperture: cur.aperture, uRaysAmt: cur.rays, uLightPow: cur.lightPow, uVel: cur.speed * 0.55,
  };
  bindTarget(T.scene);
  use(P.part, { ...pu, uHero: 0 }, { uRays: T.rays.tex });
  gl.bindVertexArray(dust.vao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, dust.n);
  use(P.part, { ...pu, uHero: 1, uDensity: Math.min(1, cur.density * 1.4 + 0.2) }, { uRays: T.rays.tex });
  gl.bindVertexArray(heroes.vao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, heroes.n);
  gl.disable(gl.BLEND);

  // Bloom : descente puis remontée de la chaîne de mips.
  let src = T.scene;
  T.mips.forEach((m, i) => { pass(P.down, m, { uHp: [0.5 / src.w, 0.5 / src.h], uFirst: i === 0 ? 1 : 0 }, { uTex: src.tex }); src = m; });
  pass(P.fx, T.fa, { uThresh: 1.4 }, { uTex: T.mips[1].tex });
  let fa = T.fa, fbt = T.fb;
  for (const s of [1, 4, 16, 48]) { pass(P.fb, fbt, { uStep: s / fa.w }, { uTex: fa.tex }); [fa, fbt] = [fbt, fa]; }
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = T.mips.length - 1; i > 0; i--) {
    const s = T.mips[i];
    pass(P.up, T.mips[i - 1], { uHp: [0.5 / s.w, 0.5 / s.h] }, { uTex: s.tex });
  }
  gl.disable(gl.BLEND);

  pass(P.comp, null, {
    uRes: [W, H], uAsp: asp, uExposure: cur.exposure, uBloomAmt: 0.02, uFlareAmt: cur.flare * 0.5,
    uFade: fade, uTime: time, uBars: 0,
  }, { uScene: T.scene.tex, uBloom: T.mips[0].tex, uFlare: fa.tex });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
