<style>

  }
  #title::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 55% 30% at 50% 50%, rgba(0, 0, 0, .55), transparent 70%); z-index: -1; }
  #title h1 { margin: 0; font-weight: 200; text-transform: uppercase; letter-spacing: .4em; padding-left: .4em; font-size: clamp(22px, 3.6vw, 72px); color: #fff0dc; text-shadow: 0 0 2px rgba(0, 0, 0, .9), 0 0 18px rgba(0, 0, 0, .8); filter: drop-shadow(0 0 22px rgba(255, 170, 80, .35)); }
  #title p { margin: 1.4em 0 0; text-transform: uppercase; letter-spacing: .8em; padding-left: .8em; font-size: clamp(10px, 1vw, 17px); color: rgba(255, 220, 180, .6); }

<!-- lecteur-concert:debut -->
<script>
/* Lecteur commun, embarqué dans chaque page par synchroniser-lecteur.py. */
function creerLecteurConcert(options) {
  const vitesses = [.25, .5, 1, 2, 4, 8, 16];
  const limite = t => Math.max(0, Math.min(options.duration, Number(t) || 0));
  const format = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  const params = new URLSearchParams(location.search);
  const vitesseDemandee = Number(params.get('vitesse')) || 1;
  let vitesse = vitesses.includes(vitesseDemandee) ? vitesseDemandee : 1;
  let base = 0, origine = performance.now(), lecture = false, commence = false;
  let disponible = options.ready !== false, cinema = !!options.cinema, minuterie;
  let dernierAffichage = '', message = '';
  const style = document.createElement('style');
  style.textContent = `
    #lecteur-concert { position:fixed; z-index:20; left:16px; bottom:16px; max-width:calc(100vw - 32px); max-height:calc(100vh - 32px); overflow:auto; box-sizing:border-box; padding:10px 12px; border:0; border-radius:6px; background:rgba(6,8,20,.66); color:rgba(220,225,255,.82); font:12px/1.55 ui-monospace,Menlo,monospace; white-space:pre-wrap; transition:opacity .4s; }
    body.lecteur-cache { cursor:none; }
    body.lecteur-cache #lecteur-concert, body.lecteur-cache .caption { opacity:0; pointer-events:none; }
    .lc-bande { position:fixed; z-index:10; left:0; right:0; height:max(0px,calc((100vh - 100vw / 2.39) / 2)); background:#000; pointer-events:none; display:none; }
    .lc-bande-haut { top:0; } .lc-bande-bas { bottom:0; }
    body.lecteur-cinema .lc-bande { display:block; }
    @media(max-width:600px) { #lecteur-concert { left:8px; bottom:8px; max-width:calc(100vw - 16px); max-height:calc(100vh - 16px); font-size:11px; } }
  `;
  document.head.append(style);
  const panneau = document.createElement('div');
  panneau.id = 'lecteur-concert';
  panneau.setAttribute('role', 'region');
  panneau.setAttribute('aria-label', 'Informations et raccourcis de lecture');
  document.body.append(panneau);
  for (const cote of ['haut', 'bas']) {
    const bande = document.createElement('div');
    bande.className = `lc-bande lc-bande-${cote}`;
    bande.setAttribute('aria-hidden', 'true');
    document.body.append(bande);
  }
  document.body.classList.toggle('lecteur-cinema', cinema);
  function temps(now = performance.now()) {
    return limite(base + (lecture ? (now - origine) / 1000 * vitesse : 0));
  }
  function partieA(t) {
    let partie = 0;
    options.parts.forEach((p, i) => { if (t >= p.start) partie = i; });
    return partie;
  }
  function etat(now = performance.now()) {
    const time = temps(now);
    if (lecture && time >= options.duration) {
      base = options.duration; lecture = false; afficher();
    }
    return { time, playing:lecture, started:commence, speed:vitesse, cinema };
  }
  function afficher() {
    document.body.classList.remove('lecteur-cache');
    clearTimeout(minuterie);
    if (lecture) minuterie = setTimeout(() => document.body.classList.add('lecteur-cache'), 4000);
  }
  function positionner(t, raison = 'recalage') {
    base = limite(t); origine = performance.now(); commence = true;
    options.onSeek?.(base, raison);
    afficher(); actualiser();
  }
  function jouer(valeur) {
    if (!disponible) return;
    base = temps(); origine = performance.now();
    if (valeur && (!commence || base >= options.duration)) positionner(0, 'debut');
    commence = true; lecture = valeur;
    afficher(); actualiser();
  }
  function debut() {
    if (!disponible) return;
    positionner(0, 'debut'); jouer(true);
  }
  function changerVitesse(valeur) {
    base = temps(); origine = performance.now(); vitesse = valeur;
    afficher(); actualiser();
  }
  function ajusterVitesse(sens) {
    changerVitesse(vitesses[Math.max(0, Math.min(vitesses.length - 1, vitesses.indexOf(vitesse) + sens))]);
  }
  async function pleinEcran() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { message = 'Plein écran indisponible dans cet aperçu.'; }
    afficher(); actualiser();
  }
  function changerCinema() {
    cinema = !cinema;
    document.body.classList.toggle('lecteur-cinema', cinema);
    afficher();
  }
  function actualiser() {
    const courant = etat(), partie = partieA(courant.time);
    const statut = !disponible ? 'Chargement' : !commence ? 'Prêt' : courant.time >= options.duration ? 'Fin' : lecture ? 'Lecture' : 'Pause';
    const touches = options.parts.slice(0, 9).map((p, i) => `  ${i + 1} ${p.name}`).join('\n');
    const texte = `${options.name}\n${statut} · ${format(courant.time)} / ${format(options.duration)} · ×${String(vitesse).replace('.', ',')} · ${options.parts[partie].name}`
      + (options.details ? '\n' + options.details() : '')
      + '\n\nEspace / Entrée lecture / pause   R début\n← → ~10 s   + - vitesse   F plein écran   L cinéma   H commandes\nPage ↑ / ↓ partie précédente / suivante'
      + (options.help ? '\n' + options.help : '')
      + '\n' + touches + (message ? '\n' + message : '');
    if (texte !== dernierAffichage) { panneau.textContent = texte; dernierAffichage = texte; }
  }
  addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest('button,input,select,textarea,[contenteditable="true"]')) return;
    const touche = e.key.toLowerCase();
    if (touche === ' ' || touche === 'enter') { e.preventDefault(); jouer(!lecture); }
    else if (touche === 'r') debut();
    else if (touche === 'arrowleft' || touche === 'arrowright') { e.preventDefault(); positionner(temps() + (touche === 'arrowright' ? 10 : -10)); }
    else if (touche === '+' || touche === '=') ajusterVitesse(1);
    else if (touche === '-') ajusterVitesse(-1);
    else if (/^[1-9]$/.test(touche) && options.parts[Number(touche) - 1]) positionner(options.parts[Number(touche) - 1].start);
    else if (touche === 'pageup' || touche === 'pagedown') {
      e.preventDefault();
      const index = Math.max(0, Math.min(options.parts.length - 1, partieA(temps()) + (touche === 'pagedown' ? 1 : -1)));
      positionner(options.parts[index].start);
    }
    else if (touche === 'f') pleinEcran();
    else if (touche === 'l') changerCinema();
    else if (touche === 'h') { clearTimeout(minuterie); document.body.classList.toggle('lecteur-cache'); }
    else if (options.onKey?.(touche)) { afficher(); actualiser(); }
  });
  addEventListener('pointermove', afficher);
  addEventListener('pointerdown', afficher);
  function miseAJour() { actualiser(); requestAnimationFrame(miseAJour); }
  const api = {
    read:etat, seek:positionner, restart:debut, setPlaying:jouer, setSpeed:changerVitesse, wake:afficher,
    setReady(valeur) { disponible = valeur; if (!valeur) { base = temps(); lecture = false; } actualiser(); },
  };
  // ?t=... reste un aperçu en pause, avec les mêmes commandes que la lecture normale.
  if (params.has('t')) positionner(Number(params.get('t')), 'apercu');
  actualiser(); requestAnimationFrame(miseAJour);
  return api;
}
</script>
<!-- lecteur-concert:fin -->
<script>
/*
  Everybody's Changing : composition des trois pistes, en trois couches.
    1. Fond : la lumière qui tourne, vaporeuse et discrète, de la nuit au crépuscule.
    2. Cernes : des anneaux d'or flous qui s'ajoutent un à un derrière.
    3. Figures de Chladni : la poussière d'or, une nouvelle figure à chaque phrase.
  Plan calé sur la version album (Hopes and Fears, 3:35), d'après les horodatages des paroles synchronisées (lrclib.net).
  Lecture à vitesse réelle par défaut ; ?vitesse=4 pour voir l'ensemble en accéléré (touches + et -).
*/
const SECTIONS = [
  { name: "Intro piano", start: 0, spin: 0.015 },
  { name: "Couplet 1", start: 22.6, spin: 0.02 },
  { name: "Pré-refrain 1", start: 42.7, spin: 0.03 },
  { name: "Refrain 1", start: 63.4, spin: 0.06 },
  { name: "Interlude piano", start: 92.5, spin: 0.02 },
  { name: "Couplet 2", start: 104.0, spin: 0.025 },
  { name: "« fading into beautiful light »", start: 107.0, spin: 0.02 },
  { name: "Pré-refrain 2", start: 114.3, spin: 0.035 },
  { name: "Refrain 2", start: 124.9, spin: 0.065 },
  { name: "Pont instrumental", start: 153.1, spin: 0.03, tilt: 0.95 },
  { name: "Refrain final", start: 170.8, spin: 0.075 },
  { name: "Dernière phrase", start: 200.1, spin: 0.015 },
  { name: "Fin", start: 209.4, spin: 0.01 },
];
const END = 209.4, FADE = 6, DURATION = END + FADE;
const SCENE_IN = [9.5, 16];   // le titre passe seul sur le fond ; poussière et cernes arrivent ensuite

// Une figure par phrase chantée (0,6 s avant la voix), de plus en plus complexes ; retour à la première à la fin.
// [n, m, signe] : mode de vibration de la plaque. "lift" : la poussière s'envole.
const FIGS = [
  [0, null], [21.9, [1, 2, 1]], [32.1, [2, 3, -1]],
  [42.1, [1, 4, 1]], [47.0, [3, 4, -1]], [52.4, [2, 5, 1]],
  [62.8, [3, 5, -1]], [67.9, [1, 6, 1]], [73.0, [4, 5, 1]], [77.8, [2, 7, -1]], [82.8, [3, 8, 1]],
  [92.5, [2, 3, 1]], [98.5, [4, 5, -1]],
  [103.4, [4, 7, -1]], [106.4, "lift"], [113.7, [2, 5, -1]],
  [124.3, [5, 6, 1]], [129.2, [3, 8, -1]], [134.4, [4, 7, 1]], [139.3, [1, 8, -1]], [144.2, [5, 8, 1]],
  [153.1, [6, 7, -1]], [161.9, [5, 9, -1]],
  [170.2, [5, 9, 1]], [175.3, [7, 8, -1]], [180.3, [3, 10, 1]], [185.1, [6, 9, -1]], [190.2, [7, 10, 1]],
  [199.5, [1, 2, 1]],
];

// Fond : palettes (sombre, moyen, clair, reflet) qui glissent d'un moment de la journée à l'autre.
const PAL = {
  nuit:       [[0.02, 0.03, 0.08], [0.07, 0.10, 0.26], [0.24, 0.28, 0.52], [0.80, 0.66, 0.50]],
  aube:       [[0.10, 0.07, 0.20], [0.50, 0.32, 0.52], [0.98, 0.62, 0.56], [1.00, 0.86, 0.72]],
  matin:      [[0.38, 0.17, 0.20], [0.93, 0.52, 0.40], [1.00, 0.78, 0.58], [1.00, 0.95, 0.86]],
  or:         [[0.30, 0.14, 0.03], [0.84, 0.52, 0.14], [1.00, 0.80, 0.38], [1.00, 0.96, 0.80]],
  crepuscule: [[0.16, 0.04, 0.07], [0.68, 0.18, 0.12], [0.98, 0.48, 0.20], [1.00, 0.80, 0.50]],
  braise:     [[0.05, 0.02, 0.04], [0.32, 0.08, 0.14], [0.72, 0.32, 0.20], [1.00, 0.68, 0.40]],
};
const PAL_KEYS = [[0, "nuit"], [22, "aube"], [63, "matin"], [104, "or"], [125, "crepuscule"], [153, "braise"], [200, "nuit"]];

const BG_LEVEL = 0.34;      // le fond reste discret
const RING_LEVEL = 0.17;    // cernes en retrait
const N = 100000;           // grains de poussière d'or
const NR = 22;              // cernes

const cv = document.getElementById("c");
const gl = cv.getContext("webgl2", { antialias: false });
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
function prog(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); return p; }

/* ---------- Couches 1 et 2 : fond et cernes ---------- */
const BG = prog(`#version 300 es
in vec2 a; out vec2 v; void main(){ v = a * 0.5 + 0.5; gl_Position = vec4(a, 0, 1); }`,
`#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform vec2 uRes; uniform float uT, uFrame, uBg, uRingAmt, uRingFade, uFade, uLift;
uniform vec3 uPal[4];
uniform vec4 uRing[${NR}];   // rayon, largeur (flou compris), angle, croissance

float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.55; for (int i = 0; i < 3; i++) { s += a * n(p); p = p * 1.9 + 11.7; a *= 0.45; } return s / 0.95; }

// Champ de couleur vaporeux : peu d'octaves, grandes formes, mouvement très lent.
vec3 field(vec2 p, float t){
  vec2 q = vec2(fbm(p * 0.7 + vec2(0.0, t * 0.035)), fbm(p * 0.7 + vec2(5.2, 1.3) - t * 0.03));
  float r = fbm(p * 0.55 + 2.0 * q + vec2(t * 0.018, -t * 0.012));
  vec3 c = mix(uPal[0], uPal[1], smoothstep(0.25, 0.7, r));
  c = mix(c, uPal[2], smoothstep(0.55, 0.95, r * 0.6 + q.x * 0.6) * 0.8);
  c = mix(c, uPal[3], smoothstep(0.8, 1.05, r * 0.5 + q.y * 0.7) * 0.4);
  return c;
}

void main(){
  vec2 p = (v - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  vec3 c = field(p * 1.2, uT) * uBg;

  // Cernes : anneaux flous, découpés en arcs, qui se dessinent en tournant.
  float d = length(p), ang = atan(p.y, p.x), rings = 0.0;
  for (int i = 0; i < ${NR}; i++) {
    vec4 R = uRing[i];
    if (R.w <= 0.0) continue;
    float x = (d - R.x) / R.y, prof = exp(-x * x);
    if (prof < 0.003) continue;
    float fi = float(i), b = ang - R.z;
    float m = sin(b * 3.0 + fi * 1.7) + 0.6 * sin(b * 7.0 + fi * 2.3) + 0.35 * sin(b * 13.0 + fi * 0.9);
    float seg = smoothstep(-0.45, 0.25, m + 0.35);
    float u = fract(b / 6.2831853);
    float vis = smoothstep(R.w, R.w - 0.04, u);
    rings += prof * seg * vis * (0.55 + 0.45 * fract(sin(fi * 12.9898) * 43758.5453));
  }
  c += vec3(1.0, 0.70, 0.36) * rings * uRingAmt * uRingFade * smoothstep(0.06, 0.24, d);   // centre dégagé

  c += vec3(1.0, 0.80, 0.55) * uLift * 0.08 * exp(-d * d * 2.5);                    // la lumière de l'envol
  c *= 1.0 - 0.45 * smoothstep(0.35, 1.0, length((v - 0.5) * vec2(1.3, 1.0)));       // vignettage
  c *= uFade;
  c += (h(v * uRes + uFrame) - 0.5) * 0.012;                                          // grain très fin (évite les marches de dégradé)
  o = vec4(max(c, 0.0), 1.0);
}`);

/* ---------- Couche 3 : poussière d'or (figures de Chladni) ---------- */
const PT = prog(`#version 300 es
in vec4 a; uniform vec2 uScale; uniform float uSize, uTilt, uSpin, uTime, uFade, uFly; out float vB; out float vH;
void main(){
  float cs = cos(uSpin), sn = sin(uSpin);
  vec3 p = vec3(cs * a.x - sn * a.y, sn * a.x + cs * a.y, 0.0);
  float ct = cos(uTilt), st = sin(uTilt);
  p = vec3(p.x, p.y * ct, p.y * st);
  float w = 1.0 + p.z * 0.55;
  // Envol : profondeur propre à chaque grain, qui fonce vers la caméra.
  float z = pow(uFly, 1.6) * (0.35 + 0.9 * fract(a.w * 7.31)) * (0.75 + 0.5 * a.w);
  w *= 1.0 - min(z, 0.97);
  p.xy += vec2(cos(a.w * 6283.0), sin(a.w * 6283.0)) * z * 0.35;   // léger écart propre à chaque grain : même le centre se disperse
  gl_Position = vec4(p.xy * uScale, 0.0, w);
  gl_PointSize = min(uSize / w, uSize * 6.0);
  // Paillettes : chaque grain scintille doucement, quelques-uns brillent un instant.
  float tw = 0.78 + 0.22 * sin(uTime * (1.3 + a.w * 2.7) + a.w * 80.0);
  float glint = pow(max(0.0, sin(uTime * (0.6 + a.w * 1.1) + a.w * 311.0)), 60.0) * 3.0;
  vB = a.z * (tw + glint) * uFade * smoothstep(0.03, 0.3, w) * min(1.0, w * w * 1.6); vH = a.w;   // en approchant, le grain s'étale et s'atténue
}`,
`#version 300 es
precision highp float; in float vB; in float vH; uniform float uAlpha, uSharp; out vec4 o;
void main(){ vec2 d = gl_PointCoord * 2.0 - 1.0; float r2 = dot(d, d); if (r2 > 1.0) discard;
  vec3 col = mix(vec3(1.0, 0.58, 0.24), vec3(1.0, 0.86, 0.58), vH);
  o = vec4(col * exp(-r2 * uSharp) * uAlpha * vB, 1.0); }`);

const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const buf = new Float32Array(N * 4);   // x, y, éclat, teinte
function randDisk(j) { const r = Math.sqrt(Math.random()), t = Math.random() * Math.PI * 2; buf[j] = r * Math.cos(t); buf[j + 1] = r * Math.sin(t); }
for (let i = 0; i < N; i++) { randDisk(i * 4); buf[i * 4 + 2] = 0; buf[i * 4 + 3] = Math.random(); }
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, buf.byteLength, gl.DYNAMIC_DRAW);
const U = (p, n) => gl.getUniformLocation(p, n);

let W = 0, H = 0;
function resize() { const d = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * d; H = cv.height = innerHeight * d; gl.viewport(0, 0, W, H); }
addEventListener("resize", resize); resize();

// Cernes : tirage fixe.
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const RINGS = []; let rr = 0.10;
for (let i = 0; i < NR; i++) {
  rr += 0.024 + rnd() * 0.026;
  RINGS.push({ r: rr, w: 0.010 + rnd() * 0.012 + (i % 5 === 4 ? 0.008 : 0), angle: rnd() * 6.283, speed: (0.04 + rnd() * 0.08) * (i % 2 ? 1 : -1), grow: 0 });
}
const ringData = new Float32Array(NR * 4);

/* ---------- Plaque ---------- */
const PI = Math.PI;
function plate(m, x, y, out) {
  const [n, k, s] = m, X = (x + 1) * 0.5 * PI, Y = (y + 1) * 0.5 * PI;
  const cnx = Math.cos(n * X), snx = Math.sin(n * X), cky = Math.cos(k * Y), sky = Math.sin(k * Y);
  const ckx = Math.cos(k * X), skx = Math.sin(k * X), cny = Math.cos(n * Y), sny = Math.sin(n * Y);
  out[0] = cnx * cky + s * ckx * cny;
  out[1] = 0.5 * PI * (-n * snx * cky - s * k * skx * cny);
  out[2] = 0.5 * PI * (-k * cnx * sky - s * n * ckx * sny);
}

const LIFT_AT = FIGS.find((f) => f[1] === "lift")[0], LIFT_DUR = 6.5;
let fly = 0, figIdx = -1, mode = null, prevMode = null, blend = 1, kick = 0, lifting = false;
function figAt(t) { let i = 0; for (let k = 0; k < FIGS.length; k++) if (t >= FIGS[k][0]) i = k; return i; }
function setFig(i) {
  if (i === figIdx) return;
  figIdx = i; const f = FIGS[i][1];
  if (f === "lift") { lifting = true; return; }
  if (lifting) for (let j = 0; j < N * 4; j += 4) { randDisk(j); buf[j + 2] = 0; }
  lifting = false; prevMode = mode; mode = f; blend = 0; kick = 1;
}

const fA = [0, 0, 0], fB = [0, 0, 0];
function step(dt) {
  blend = Math.min(1, blend + dt / 1.1);
  kick *= Math.exp(-dt / 0.5);
  for (let i = 0; i < N; i++) {
    const j = i * 4; let x = buf[j], y = buf[j + 1];
    if (lifting) {
      // Envol : la poussière se détache de la plaque (l'avancée vers la caméra est faite dans le shader).
      const r = Math.hypot(x, y) + 1e-3;
      x += (x / r * 0.03 + (Math.random() - 0.5) * 0.05) * dt;
      y += (y / r * 0.03 + (Math.random() - 0.5) * 0.05) * dt;
      buf[j + 2] += (1.1 - buf[j + 2]) * Math.min(1, dt * 1.5);
      buf[j] = x; buf[j + 1] = y; continue;
    }
    if (x * x + y * y > 1) { randDisk(j); buf[j + 2] = 0; continue; }   // grain sorti du disque : il retombe sur la plaque
    if (!mode) {
      x += (Math.random() - 0.5) * 0.004; y += (Math.random() - 0.5) * 0.004;
      buf[j + 2] += (0.22 - buf[j + 2]) * Math.min(1, dt);
    } else {
      plate(mode, x, y, fA);
      let f = fA[0], gx = fA[1], gy = fA[2];
      if (prevMode && blend < 1) { plate(prevMode, x, y, fB); const b = blend * blend * (3 - 2 * blend); f = f * b + fB[0] * (1 - b); gx = gx * b + fB[1] * (1 - b); gy = gy * b + fB[2] * (1 - b); }
      const A = Math.min(1, Math.abs(f) * 0.5);
      const gn = Math.sqrt(gx * gx + gy * gy) + 1e-3, d = Math.max(-0.009, Math.min(0.009, 0.08 * f / gn));
      const jit = 0.0022 + 0.016 * A + 0.024 * kick;
      x += -d * gx / gn + (Math.random() - 0.5) * jit;
      y += -d * gy / gn + (Math.random() - 0.5) * jit;
      buf[j + 2] += ((0.06 + 0.94 * Math.exp(-A * 14)) - buf[j + 2]) * Math.min(1, dt * 3);
    }
    buf[j] = x; buf[j + 1] = y;
  }
}

/* ---------- Horloge, contrôles ---------- */
let spin = 0, tilt = 0, lift = 0, frameNo = 0, wall = 0;
const titleEl = document.getElementById("title");
// Le titre suit le chronomètre, y compris en pause, en accéléré et après recalage.
titleEl.style.animation = "fade 9s ease-in-out 1s both";
const titleAnimation = titleEl.getAnimations()[0];
titleAnimation.pause();
const ringAngles = RINGS.map(rg => rg.angle);
function recalerDecor(t) {
  spin = SECTIONS.reduce((somme, partie, i) => somme + Math.max(0, Math.min(t, SECTIONS[i + 1]?.start ?? t) - partie.start) * partie.spin, 0);
  tilt = SECTIONS[sectionAt(t)].tilt || 0; wall = t;
  figIdx = figAt(t);
  lifting = FIGS[figIdx][1] === 'lift';
  mode = lifting ? FIGS[figIdx - 1][1] : FIGS[figIdx][1];
  prevMode = null; blend = 1; kick = 0;
  fly = lifting ? Math.min(1, Math.max(0, (t - LIFT_AT) / LIFT_DUR)) : 0;
  lift = lifting ? 1 : 0;
  RINGS.forEach((rg, i) => { rg.grow = Math.min(1.05, Math.max(0, t - i * 9) / 3); rg.angle = ringAngles[i] + rg.speed * spin / .03; });
  // Reconstituer la figure au recalage, même en pause, sans rejouer toutes les images précédentes.
  for (let i = 0; i < N; i++) {
    const j = i * 4; randDisk(j);
    let x = buf[j], y = buf[j + 1];
    if (mode) {
      for (let k = 0; k < 10; k++) {
        plate(mode, x, y, fA);
        if (Math.abs(fA[0]) < .001) break;
        const distance = Math.hypot(fA[1], fA[2]);
        const avance = Math.max(-.15, Math.min(.15, fA[0] / (distance + 1e-6)));
        x -= avance * fA[1] / (distance + 1e-6); y -= avance * fA[2] / (distance + 1e-6);
      }
      const rayon = Math.hypot(x, y);
      if (rayon > 1) { x /= rayon; y /= rayon; }
      plate(mode, x, y, fA);
      buf[j + 2] = .06 + .94 * Math.exp(-Math.min(1, Math.abs(fA[0]) * .5) * 14);
    } else buf[j + 2] = t > 0 ? .22 : 0;
    buf[j] = x; buf[j + 1] = y;
  }
}
const lecteur = creerLecteurConcert({
  name: "Everybody's Changing", duration: DURATION, parts: SECTIONS,
  onSeek: recalerDecor
});
function sectionAt(t) { let i = 0; SECTIONS.forEach((s, k) => { if (t >= s.start) i = k; }); return i; }

function palAt(t) {
  let i = 0; for (let k = 0; k < PAL_KEYS.length; k++) if (t >= PAL_KEYS[k][0]) i = k;
  const a = PAL[PAL_KEYS[i][1]], nx = PAL_KEYS[Math.min(i + 1, PAL_KEYS.length - 1)];
  const t0 = PAL_KEYS[i][0], t1 = nx[0];
  let u = t1 > t0 ? (t - t0) / (t1 - t0) : 0; u = u * u * (3 - 2 * u);
  const b = PAL[nx[1]], out = [];
  for (let c = 0; c < 4; c++) for (let k = 0; k < 3; k++) out.push(a[c][k] + (b[c][k] - a[c][k]) * u);
  return out;
}

let last = performance.now();
function frame(now) {
  const raw = Math.min(0.05, (now - last) / 1000); last = now;
  const lecture = lecteur.read(now), songT = lecture.time, rate = lecture.speed;
  const dt = lecture.playing ? raw * rate : 0;
  wall += dt;
  titleAnimation.currentTime = songT * 1000;
  const sec = SECTIONS[sectionAt(songT)];

  setFig(figAt(songT));
  if (dt > 0) { const sub = rate >= 2 ? 2 : 1; for (let i = 0; i < sub; i++) step(dt / sub); }
  spin += dt * sec.spin;
  tilt += ((sec.tilt || 0) - tilt) * (1 - Math.exp(-dt / 2.5));
  fly = lifting ? Math.min(1, Math.max(0, (songT - LIFT_AT) / LIFT_DUR)) : 0;
  lift += ((lifting ? 1 : 0) - lift) * (1 - Math.exp(-dt / 1.5));
  const out = 1 - Math.min(1, Math.max(0, (songT - END) / FADE));
  const fade = Math.min(1, songT / 4) * out;
  const sceneIn = Math.min(1, Math.max(0, (songT - SCENE_IN[0]) / (SCENE_IN[1] - SCENE_IN[0])));
  const sceneFade = sceneIn * sceneIn * (3 - 2 * sceneIn) * out;

  // Cernes : un de plus toutes les ~9 s ; ils tournent plus vite dans les refrains.
  const nVis = Math.min(NR, 1 + Math.floor(songT / 9));
  RINGS.forEach((rg, i) => {
    rg.grow = i < nVis ? Math.min(1.05, rg.grow + dt / 3) : Math.max(0, rg.grow - dt / 2);
    rg.angle += rg.speed * dt * (sec.spin / 0.03);
    ringData.set([rg.r * (1 + lift * 0.25), rg.w, rg.angle, rg.grow], i * 4);
  });

  // Couches 1 et 2
  gl.disable(gl.BLEND); gl.useProgram(BG);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(U(BG, "uRes"), W, H); gl.uniform1f(U(BG, "uT"), songT); gl.uniform1f(U(BG, "uFrame"), (frameNo++ % 97) * 1.37);
  gl.uniform1f(U(BG, "uBg"), BG_LEVEL); gl.uniform1f(U(BG, "uRingAmt"), RING_LEVEL); gl.uniform1f(U(BG, "uFade"), fade); gl.uniform1f(U(BG, "uRingFade"), sceneFade * (1 - 0.6 * lift)); gl.uniform1f(U(BG, "uLift"), lift);
  gl.uniform3fv(U(BG, "uPal"), palAt(songT)); gl.uniform4fv(U(BG, "uRing"), ringData);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // Couche 3
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.useProgram(PT);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferSubData(gl.ARRAY_BUFFER, 0, buf);
  gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
  const s = 0.74, k = H / 1080;
  gl.uniform2f(U(PT, "uScale"), s * H / W, s); gl.uniform1f(U(PT, "uTilt"), tilt); gl.uniform1f(U(PT, "uSpin"), spin);
  gl.uniform1f(U(PT, "uTime"), wall); gl.uniform1f(U(PT, "uFade"), sceneFade); gl.uniform1f(U(PT, "uFly"), fly);
  gl.uniform1f(U(PT, "uSize"), 22 * k); gl.uniform1f(U(PT, "uAlpha"), 0.008 * (1 - fly) * (1 - fly));   // pendant l'envol, plus de halo : des grains nets qui foncent vers nous gl.uniform1f(U(PT, "uSharp"), 3.5);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.uniform1f(U(PT, "uSize"), 3.2 * k); gl.uniform1f(U(PT, "uAlpha"), 0.085); gl.uniform1f(U(PT, "uSharp"), 2.2);
  gl.drawArrays(gl.POINTS, 0, N);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
