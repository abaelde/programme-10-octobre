<title>Programme du 10 octobre</title>
<style>
  :root { --bg: #faf8f5; --surface: #fff; --text: #1f1d1a; --muted: #6b665e; --line: #e4dfd6; --accent: #b5532f; --err: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #181715; --surface: #22201d; --text: #ece8e1; --muted: #a39d93; --line: #36332e; --accent: #e0825e; --err: #f2b8b5; }
  }

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  input, button { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; }
  input { border: 1px solid var(--line); background: var(--bg); color: var(--text); margin-bottom: 10px; }
  button { border: 0; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--err); margin: 10px 0 0; min-height: 1.4em; }
</style>

const CLE = "programme-10-octobre-mdp";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function dechiffrer(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(DATA.salt), iterations: DATA.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, cle, b64(DATA.ct));
  return new TextDecoder().decode(clair);
}

function afficher(html) { document.open(); document.write(html); document.close(); }

async function essayer(mdp, memoriser) {
  try {
    const html = await dechiffrer(mdp);
    if (memoriser) { try { localStorage.setItem(CLE, mdp); } catch (e) {} }
    afficher(html);
    return true;
  } catch (e) { return false; }
}

(async () => {
  let memo = null;
  try { memo = localStorage.getItem(CLE); } catch (e) {}
  if (memo && await essayer(memo, false)) return;
  try { localStorage.removeItem(CLE); } catch (e) {}
  const f = document.getElementById("f");
  f.hidden = false;
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const bouton = document.getElementById("ok");
    const err = document.getElementById("err");
    bouton.disabled = true; err.textContent = "";
    if (!await essayer(document.getElementById("mdp").value, true)) {
      err.textContent = "Mot de passe incorrect.";
      bouton.disabled = false;
    }
  });
})();
</script>
